services:
  nginx:
    build:
      context: ./deploy/nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DB_URL=${DB_URL}
      - DB_POOL_MODE=${DB_POOL_MODE:-transaction}
      - IMAGE_ENGINE_URL=${IMAGE_ENGINE_URL}
      - VIDEO_ENGINE_URL=${VIDEO_ENGINE_URL}
      - ENGINE_BEARER_TOKEN=${ENGINE_BEARER_TOKEN}
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/backend}
    expose:
      - "3000"
    depends_on:
      - backend
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.loop"]
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DB_URL=${DB_URL}
      - DB_POOL_MODE=${DB_POOL_MODE:-transaction}
      - IMAGE_ENGINE_URL=${IMAGE_ENGINE_URL}
      - VIDEO_ENGINE_URL=${VIDEO_ENGINE_URL}
      - ENGINE_BEARER_TOKEN=${ENGINE_BEARER_TOKEN}
    restart: unless-stopped